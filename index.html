<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chase Rugby Prep</title>
<meta name="theme-color" content="#1f5a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rugby Prep">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: single phone column, sticky top bar, one exercise card per screen while training, tab bar at bottom */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#15211d; --muted:#5d6b66; --line:#d5dcd9;
  --accent:#e2541b; --accent-ink:#ffffff; --pitch:#1f5a44; --pitch-soft:#dcebe4;
  --warn:#b7791f; --warn-soft:#fbf0dc; --bad:#b42318; --bad-soft:#fde7e4; --good:#1f7a4d;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18211e; --ink:#e7eeeb; --muted:#9aaaa4; --line:#2b3733;
  --accent:#f26b33; --accent-ink:#140b06; --pitch:#7fc7a5; --pitch-soft:#1d3229;
  --warn:#e3ab55; --warn-soft:#3a2d15; --bad:#f27a6c; --bad-soft:#3b1b17; --good:#6fcf9b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18211e; --ink:#e7eeeb; --muted:#9aaaa4; --line:#2b3733;
  --accent:#f26b33; --accent-ink:#140b06; --pitch:#7fc7a5; --pitch-soft:#1d3229;
  --warn:#e3ab55; --warn-soft:#3a2d15; --bad:#f27a6c; --bad-soft:#3b1b17; --good:#6fcf9b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.phasetag{font-family:var(--display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:right;line-height:1.1}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.4px;margin:0;text-wrap:balance}
h1{font-size:40px;line-height:.95;font-weight:800}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:700}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:600 15px var(--body);padding:10px 6px;cursor:pointer;min-width:0}
.seg button[aria-pressed="true"]{background:var(--pitch);color:var(--surface)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0d1411}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0d1411}}
.btn{border:0;border-radius:8px;padding:14px 18px;font:700 17px var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.banner{border-radius:8px;padding:12px 14px;font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.banner.info{background:var(--pitch-soft);color:var(--ink);border-left:4px solid var(--pitch)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan-list li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan-list li:last-child{border-bottom:0}
.plan-list .blk{grid-column:1/-1;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--pitch);font-weight:700;padding-top:6px;border:0}
.dose{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:14px}
/* Runner */
.step-count{font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted);letter-spacing:.6px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.bignum{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:52px 1fr 1fr auto;gap:8px;align-items:center}
.setrow.two{grid-template-columns:52px 1fr auto}
.setrow .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.setrow input{width:100%;min-width:0;font:600 18px var(--body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.tick{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--pitch-soft);border-radius:8px;padding:10px 14px}
.timer .bignum{font-size:36px}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--pitch);border-color:var(--pitch);color:var(--surface)}
.pain{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pain button{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:12px 4px;font:600 14px var(--body);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.pain button b{font-family:var(--display);font-size:26px}
.pain button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--bg)}
textarea{width:100%;min-height:70px;font:400 16px var(--body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
/* Log */
.loglist{display:flex;flex-direction:column}
.logitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.logitem:last-child{border-bottom:0}
.date{font-family:var(--display);font-weight:700;text-align:center;line-height:1;min-width:44px}
.date b{display:block;font-size:26px}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.p0{background:var(--pitch-soft);color:var(--pitch)}
.pill.p1{background:var(--warn-soft);color:var(--warn)}
.pill.p2,.pill.p3{background:var(--bad-soft);color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.spark{width:100%;height:46px}
.phase{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.phase .num{font-family:var(--display);font-weight:800;font-size:34px;color:var(--accent);line-height:1;min-width:28px}
.phase.now{background:var(--pitch-soft);border-radius:8px;padding:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{padding:8px 2px;border-radius:6px;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line);min-width:0}
.week .lift{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.week .lite{background:var(--warn-soft);border-color:var(--warn)}
.week .rug{background:var(--pitch);color:var(--surface);border-color:var(--pitch)}
.week small{display:block;font-weight:600;font-size:10px;opacity:.85}
.pill.pnew{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.good{color:var(--good);font-weight:700}.badt{color:var(--bad);font-weight:700}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dot.d0{background:var(--pitch-soft);color:var(--pitch)}.dot.d1{background:var(--warn-soft);color:var(--warn)}.dot.d2,.dot.d3{background:var(--bad-soft);color:var(--bad)}
details summary{cursor:pointer;font-weight:700;color:var(--pitch);padding:4px 0}
details[open] summary{margin-bottom:8px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.field{font:600 17px var(--body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
button.logitem{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
nav.tabs button{font-size:13px!important;letter-spacing:.6px!important}
.vwrap{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;min-width:0}
.vbtn{align-self:flex-start;border:1px solid var(--pitch);background:transparent;color:var(--pitch);font:700 14px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.plan-list .vbtn{padding:4px 10px;font-size:12px}
.vbtn[aria-expanded="true"]{background:var(--pitch);color:var(--surface)}
.vframe{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:8px;overflow:hidden}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.linkbtn{border:0;background:none;color:var(--pitch);font:600 14px var(--body);text-decoration:underline;cursor:pointer;padding:0}
.vbox a{color:var(--pitch);font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 14px var(--display);text-transform:uppercase;letter-spacing:1px;padding:16px 4px;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">Rugby <span>Prep</span></div>
    <div class="phasetag" id="phasetag"></div>
  </header>
  <main id="app"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button id="tab-today" data-tab="today" aria-current="page">Today</button>
  <button id="tab-analysis" data-tab="analysis">Analysis</button>
  <button id="tab-log" data-tab="log">History</button>
  <button id="tab-plan" data-tab="plan">Plan</button>
</div></nav>

<script>
/* ---------- Program content ---------- */
const PHASES = [
  {n:1,key:"p1",name:"Preseason Build",start:"2026-11-02",end:"2026-12-06",
   goal:"Learn the lifts, build your base, sharpen your first three steps. Three full sessions a week.",
   week:["lift","rest","lift","rest","lift","off","off"]},
  {n:2,key:"p2",name:"In-Season Build",start:"2026-12-07",end:"2027-01-31",
   goal:"Rugby starts. Monday is the big day. Wednesday is lighter with no sprints so your legs are fresh for Thursday. Friday is short and easy.",
   week:["lift","rug","lift","rug","lite","off","off"]},
  {n:3,key:"p3",name:"Stay Sharp",start:"2027-02-01",end:"2027-03-31",
   goal:"Keep the strength you built. Fewer reps, a little heavier, plenty of rest. Friday wakes your legs up for the weekend.",
   week:["lift","rug","lift","rug","lite","off","off"]}
];
const HOLIDAY = {start:"2026-12-21",end:"2026-12-27"};

const SQUAT_LEVELS = [
  {name:"Goblet squat",where:"home or gym",cue:["Hold one dumbbell at your chest, elbows down.","Sit between your heels. Chest up, heels flat.","Hips at or below knees, then stand tall."],
   unlock:"Move up when you do 3 sets of 8 with the 25 lb dumbbell and clean form two sessions in a row."},
  {name:"Smith machine squat",where:"gym",cue:["Bar across your upper back, not your neck.","Feet slightly in front of the bar, shoulder width.","Set the safety stops just below your bottom position.","Start with the empty bar. Add 5 to 10 lb only when every rep looks the same."],
   unlock:"Move up when you do 3 sets of 6 with good depth two sessions in a row, and a spotter is with you."},
  {name:"Barbell back squat",where:"gym, spotter required",cue:["Spotter or Dad present. Safety bars set in the rack.","Start with the empty 45 lb bar.","Brace your stomach before each rep.","Stop the set if your heels lift or knees cave in."],
   unlock:"Top level. Add weight in small steps only."}
];
const PUSH_LEVELS = [
  {name:"Incline push-up (hands on bench)",cue:["Hands on a bench or box.","Body in one straight line, head to heels.","Chest touches the bench, elbows angled back, not flared out."],unlock:"Move up when you do 3 sets of 12 with a straight body."},
  {name:"Low incline push-up (hands on step)",cue:["Hands on a low step or plate stack.","Squeeze your glutes so your hips stay in line.","Lower for 2 seconds, push up hard."],unlock:"Move up when you do 3 sets of 10 with a straight body."},
  {name:"Floor push-up",cue:["Hands just outside shoulders.","Chest to a fist-height off the floor.","Hips never sag."],unlock:"Top level. Add reps."}
];

const BENCH_LEVELS = [
  {name:"Dumbbell bench press",cue:["Feet flat, shoulder blades squeezed together.","Lower the dumbbells to the sides of your chest.","Press up and slightly together."],unlock:"Move up when you do 3 sets of 8 with 25 lb dumbbells and steady arms two sessions in a row."},
  {name:"Smith machine bench press",cue:["Set the safety stops just above your chest.","Bar lowers to the middle of your chest.","Start with the empty bar. Add 5 lb only when every rep is clean."],unlock:"Move up when you do 3 sets of 6 with clean reps two sessions in a row, and a spotter is with you."},
  {name:"Barbell bench press",cue:["Spotter or Dad standing behind you, or safety arms set at chest height. No exceptions.","Start with the empty 45 lb bar.","Bar touches mid-chest, press straight up.","Never bench alone."],unlock:"Top level. Add weight in small steps only."}
];
const PRESS_LEVELS = [
  {name:"Dumbbell push press",cue:["Dumbbells at your shoulders, palms facing in.","Small dip at the knees, then drive up with your legs.","Use the leg drive to press the dumbbells overhead.","Lower to your shoulders with control."],unlock:"Move up when you do 3 sets of 8 with 20 lb dumbbells and the arms lock out straight overhead."},
  {name:"Barbell push press",cue:["Bar resting on the front of your shoulders.","Quick dip, then explode up and press.","Head moves back, then through, under the bar.","Start with the empty bar."],unlock:"Top level. Add 5 lb only when every rep is clean."}
];
const LEVELS={squat:SQUAT_LEVELS,push:PUSH_LEVELS,bench:BENCH_LEVELS,press:PRESS_LEVELS};
const HOME_LEVEL={
  squat:{name:"Goblet squat (home)",cue:["Hold your heaviest dumbbell at your chest.","3 seconds down, then stand up fast.","Hips at or below knees, heels flat."]},
  bench:{name:"Dumbbell floor press (home)",cue:["Lie on the floor, knees bent.","Lower until your upper arms touch the floor.","Press up hard."]},
  press:{name:"Dumbbell push press (home)",cue:["Dumbbells at your shoulders.","Small dip, drive up with your legs, press overhead.","Lower with control."]}
};

// kind: weight | reps | sprint | check
const EX = {
  wu:{name:"Dynamic warm-up",kind:"check",block:"Warm-up",rest:0,
      cue:["Easy jog, 2 laps or 2 minutes","Leg swings, 10 each way each leg","Walking lunge with reach, 10","Inchworms, 5","A-skips, 2 x 15 m","3 build-up runs at half, three-quarter and near full speed"]},
  lad1:{name:"Ladder: one foot in each box",kind:"check",block:"Ladder",rest:30,cue:["Quick, light feet on the balls of your feet.","Arms drive like you are sprinting.","Speed comes after clean feet."]},
  lad2:{name:"Ladder: two feet in each box",kind:"check",block:"Ladder",rest:30,cue:["Both feet in every box.","Stay tall, eyes up, not on your feet."]},
  lad3:{name:"Ladder: lateral in-in-out-out",kind:"check",block:"Ladder",rest:30,cue:["Facing the side of the ladder.","In, in, out, out, moving sideways.","Do each direction."]},
  lad4:{name:"Ladder: icky shuffle",kind:"check",block:"Ladder",rest:30,cue:["In, in, out, moving forward and side to side.","Walk it first, then speed up."]},
  sp1:{name:"Falling start sprint, 10 m",kind:"sprint",block:"Speed",rest:90,cue:["Stand tall, lean forward until you have to step.","Push the ground back hard for the first 3 steps.","Full speed for 10 m, then slow down gradually.","Full rest between reps. Every rep should be fast."]},
  sp2:{name:"Two-point start sprint, 10 m",kind:"sprint",block:"Speed",rest:90,cue:["Split stance, front knee bent, weight on the front foot.","Explode out low, rise over the first 5 steps.","Time it if a friend has a stopwatch."]},
  sp3:{name:"Push-up start sprint, 10 m",kind:"sprint",block:"Speed",rest:90,cue:["Start lying on your chest. Like getting up off a ruck.","Pop up and sprint 10 m.","Get to your feet fast, then stay low for 3 steps."]},
  py1:{name:"Pogo hops",kind:"check",block:"Jumps",rest:45,cue:["Small, fast hops off the balls of your feet.","Stiff ankles, quiet landings."]},
  py2:{name:"Broad jump and stick",kind:"reps",block:"Jumps",rest:60,cue:["Swing arms, jump forward as far as you can.","Land soft and hold still for 2 seconds.","Walk back. Quality over number."]},
  py3:{name:"Lateral bound and stick",kind:"reps",block:"Jumps",rest:60,cue:["Jump sideways off one leg, land on the other.","Hold the landing for 2 seconds.","Knee stays over your toes."]},
  sq:{name:"Back squat",kind:"weight",block:"Main lifts",rest:120,levels:"squat"},
  bench:{name:"Bench press",kind:"weight",block:"Main lifts",rest:120,levels:"bench"},
  lat:{name:"Lat pulldown",kind:"weight",block:"Main lifts",rest:90,home:"latH",gymOnly:true,cue:["Thighs tucked under the pad.","Hands a little wider than shoulders.","Pull the bar to your upper chest, elbows down and back.","Let it up slowly. No swinging."]},
  latH:{name:"One-arm dumbbell row (home lat pull)",kind:"weight",block:"Main lifts",rest:60,cue:["One hand and knee on a bed, couch or chair.","Pull the dumbbell to your hip, elbow close.","Pause 1 second at the top. 3 seconds down."]},
  pp:{name:"Push press",kind:"weight",block:"Main lifts",rest:120,levels:"press"},
  pu:{name:"Push-up form drill",kind:"reps",block:"Warm-up",rest:45,levels:"push"},
  curl:{name:"Dumbbell biceps curl",kind:"weight",block:"Extras",rest:45,cue:["Elbows pinned to your sides.","Curl up, squeeze, 2 seconds down.","No swinging your back."]},
  tri:{name:"Dumbbell overhead triceps extension",kind:"weight",block:"Extras",rest:45,cue:["One dumbbell held in both hands overhead.","Lower behind your head, elbows pointing up.","Press back up. Stomach tight, ribs down."]},
  calf:{name:"Single-leg calf raise",kind:"reps",block:"Extras",rest:30,cue:["Ball of one foot on a step, hold a rail or wall.","Up on your toes, pause 1 second.","Lower your heel below the step slowly.","Hold a dumbbell when 15 gets easy."]},
  rdl:{name:"Dumbbell Romanian deadlift",kind:"weight",block:"Strength",rest:75,cue:["Dumbbells in front of your thighs.","Push your hips back, soft knees, flat back.","Lower until you feel your hamstrings stretch, then drive hips forward.","Slow on the way down, 3 seconds."]},
  row:{name:"One-arm dumbbell row",kind:"weight",block:"Strength",rest:60,cue:["One hand and knee on a bench.","Pull the dumbbell to your hip.","Pause at the top, lower slow."]},
  sps:{name:"Split squat with dumbbells",kind:"weight",block:"Strength",rest:75,cue:["Long stance, back heel up.","Drop your back knee straight down toward the floor.","Front heel stays flat."]},
  stp:{name:"Dumbbell step-up",kind:"weight",block:"Strength",rest:75,cue:["Box, bench, or a sturdy stair about knee height.","Drive through the whole front foot.","Control the step down."]},
  fp:{name:"Dumbbell bench press",kind:"weight",block:"Strength",rest:75,home:"fpf",gymOnly:true,cue:["Feet flat, shoulder blades squeezed together.","Lower to the sides of your chest.","Press up and slightly together."]},
  fpf:{name:"Dumbbell floor press",kind:"weight",block:"Strength",rest:75,cue:["Lie on the floor, knees bent.","Lower until your upper arms touch the floor.","Press up hard."]},

function phaseFor(dateStr){
  if(dateStr<PHASES[0].start) return {...PHASES[0],week:1,pre:true};
  for(const p of PHASES){ if(dateStr>=p.start && dateStr<=p.end){
    const wk=Math.floor((parse(dateStr)-parse(p.start))/(7*864e5))+1; return {...p,week:wk}; } }
  return {...PHASES[2],week:9,after:true};
}

function buildSession(dayKey){
  const ph=phaseFor(todayStr); const tmpl=T[ph.key][dayKey];
  const len=Math.min(S.len,tmpl.max||60);
  const holiday=isHoliday(todayStr);
  const sore=lastPain()>=2;
  const out=[];
  for(const [id0,sets0,reps,tier] of tmpl.items){
    if(tier>len) continue;
    let id=id0, ex=EX[id];
    if(S.where==="home"&&ex.gymOnly){ id=ex.home; ex=EX[id]; }
    if(sore&&(ex.block==="Speed"||ex.block==="Jumps")) continue;
    let sets=sets0;
    if(ex.kind!=="check"||ex.block==="Ladder"){
      if(ph.key==="p1"&&ph.week<=2&&(ex.block==="Strength"||ex.block==="Main lifts")) sets=Math.max(1,sets-1);
      if(holiday&&ex.block!=="Warm-up"&&ex.block!=="Cool-down") sets=Math.max(1,sets-1);
    }
    out.push({id,sets,reps,ex});
  }
  return {phase:ph,label:tmpl.label,len,holiday,sore,items:out};
}
function exInfo(item){
  const ex=item.ex;
  if(ex.levels){ const k=ex.levels, arr=LEVELS[k]; const lv=Math.min(S.settings[k]||0,arr.length-1);

}

/* ---------- Storage ---------- */
function localAll(){ return ls.get("cr-sessions",{}); }
function deletedIds(){ return ls.get("cr-deleted",[]); }
async function saveSession(doc,oldId){
  const all=localAll(); if(oldId&&oldId!==doc.id){ delete all[oldId]; ls.set("cr-deleted",[...new Set([...deletedIds(),oldId])]); }
  all[doc.id]=doc; ls.set("cr-sessions",all);
  if(!db){ S.sessions=Object.values(all); return; }
  try{
    const r=await sb.from("sessions").upsert({id:doc.id,date:doc.date,doc,updated_at:new Date().toISOString()},{onConflict:"user_id,id"});
    if(r.error) throw r.error;
    if(oldId&&oldId!==doc.id){ const d=await sb.from("sessions").delete().eq("id",oldId); if(d.error) throw d.error; }
    await loadSessions();
  }catch(e){
    S.sessions=S.sessions.filter(x=>x.id!==doc.id&&x.id!==oldId); S.sessions.push(doc);
    S.offlineNote=true;
  }
}
async function deleteSession(id){
  if(db){ const d=await sb.from("sessions").delete().eq("id",id); if(d.error) throw d.error; }
  const all=localAll(); delete all[id]; ls.set("cr-sessions",all); ls.set("cr-deleted",[...new Set([...deletedIds(),id])]);
  S.sessions=S.sessions.filter(x=>x.id!==id);
}
async function loadSessions(){
  if(!db) return false;
  const {data,error}=await sb.from("sessions").select("id,doc").order("date",{ascending:false}).limit(1000);
  if(error){ S.stale=true; S.loaded=true; return false; }
  S.sessions=data.map(r=>({...r.doc,id:r.id})); S.synced=true; S.stale=false; S.loaded=true;
  try{ const all=localAll(); for(const x of S.sessions) all[x.id]=x; ls.set("cr-sessions",all); }catch(e){}
  return true;
}
async function loadSettings(){
  if(!db) return;
  const {data}=await sb.from("settings").select("data").maybeSingle();
  if(data&&data.data){ S.settings=Object.assign({squat:0,push:0,bench:0,press:0},data.data); ls.set("cr-settings",S.settings); }
}
async function syncLocal(){
  const un=unsynced(); if(!un.length) return true;
  const r=await sb.from("sessions").upsert(un.map(d=>({id:d.id,date:d.date,doc:d,updated_at:new Date().toISOString()})),{onConflict:"user_id,id"});

function unsynced(){ if(!db||!S.synced) return []; const have=new Set(S.sessions.map(s=>s.id)); const del=new Set(deletedIds()); return Object.values(localAll()).filter(s=>s.id&&!have.has(s.id)&&!del.has(s.id)); }

/* ---------- Charts ---------- */
function spark(vals,lowerBetter){
  if(vals.length<2) return `<p class="small muted" style="margin:0">${vals.length?"One entry so far":"No entries yet"}</p>`;
  const w=160,h=46,p=5; const mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1), lowerBetter? p+(v-mn)/rg*(h-2*p) : h-p-(v-mn)/rg*(h-2*p)]);
  const d=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--pitch)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)"/></svg>`;
}

/* ---------- Analysis ---------- */
const BLOCK_ORDER=["Main lifts","Strength","Hamstrings","Extras","Core","Prehab","Jumps","Warm-up"];
function liftSeries(){
  const by={};
  const asc=[...S.sessions].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.saved||0)-(b.saved||0));
  for(const s of asc){ for(const e of s.ex||[]){
    if(e.kind!=="weight"&&e.kind!=="reps") continue;
    const sets=(e.sets||[]).filter(z=>(z.r||0)>0);
    if(!sets.length) continue;
    const top=e.kind==="weight"?Math.max(...sets.map(z=>z.w||0)):Math.max(...sets.map(z=>z.r||0));
    const vol=e.kind==="weight"?sets.reduce((a,z)=>a+(z.w||0)*(z.r||0),0):sets.reduce((a,z)=>a+(z.r||0),0);
    const g=(by[e.name]=by[e.name]||{name:e.name,kind:e.kind,block:e.block,pts:[]});
    g.pts.push({date:s.date,top,vol,note:e.note||"",pain:s.pain,sets,id:s.id});
  } }
  return Object.values(by).sort((a,b)=>(BLOCK_ORDER.indexOf(a.block)-BLOCK_ORDER.indexOf(b.block))||(b.pts.length-a.pts.length));
}
function trend(pts){
  const n=pts.length; if(n<3) return {status:"new"};
  const k=Math.min(3,Math.floor(n/2)); const rec=pts.slice(n-k), pri=pts.slice(n-2*k,n-k);
  const avg=(a,f)=>a.reduce((x,p)=>x+p[f],0)/a.length;
  const pc=(a,b)=>b?((a-b)/b*100):0;
  const dw=pc(avg(rec,"top"),avg(pri,"top")), dv=pc(avg(rec,"vol"),avg(pri,"vol"));
  let status="hold";
  if((dw>=2||dv>=5)&&dw>-5&&dv>-10) status="up";
  else if((dw<=-2&&dv<=0)||dv<=-10) status="down";
  const sore=rec.some(p=>(p.pain||0)>=2);
  return {status,dw,dv,k,sore};
}
const STATUS={up:["Improving","p0"],hold:["Holding","p1"],down:["Declining","p2"],new:["Building data","pnew"]};
const sign=x=>(x>0?"+":"")+x.toFixed(0)+"%";
function chaseLine(t,kind){
  if(t.status==="new") return "Log this 3 times to see your trend.";
  if(t.status==="down"&&t.sore) return "Down lately and your legs have been sore. Talk to Dad before adding weight.";
  if(t.status==="down") return "Dipped lately. Check your sleep and form, and tell Dad.";
  if(t.status==="up") return kind==="weight"?"Going up. Keep your form clean and keep adding.":"More reps than before. Keep it going.";
  return kind==="weight"?"Steady. Try 5 lb more or one extra rep if your form is clean.":"Steady. Try one more rep per set.";
}
function setStr(e,kind){ return e.sets.map(z=>kind==="weight"?`${z.w??0}&times;${z.r??0}`:`${z.r??0}`).join(", "); }
function renderAnalysis(){
  const series=liftSeries();
  const all=sortedSessions();
  const cutoff=iso(new Date(today.getTime()-28*864e5));
  const recentCount=all.filter(s=>s.date>=cutoff).length;
  const counts={up:0,hold:0,down:0};
  const trends=series.map(g=>({g,t:trend(g.pts)}));
  trends.forEach(({t})=>{ if(counts[t.status]!=null) counts[t.status]++; });
  const asc=[...all].reverse();
  const spVals=asc.map(s=>{const ts=(s.ex||[]).filter(x=>x.kind==="sprint").flatMap(x=>x.sets.map(z=>z.t)).filter(t=>t>0);return ts.length?Math.min(...ts):null}).filter(v=>v);
  const pains=all.slice(0,8).reverse();
  let h=`<div class="card"><h2>How it's going</h2>
    <p class="small muted" style="margin:0">Each lift compares your last ${"3"} sessions with the ${"3"} before. Improving means more weight or more total volume (weight &times; reps, added up).</p>
    <div class="stats">
      <div class="stat"><span class="label">Sessions, last 4 weeks</span><span class="bignum" style="font-size:34px">${recentCount}</span><span class="small muted">Target about ${phaseFor(todayStr).key==="p1"?12:12}</span></div>
      <div class="stat"><span class="label">Lifts</span><div class="row"><span class="pill p0">${counts.up} up</span><span class="pill p1">${counts.hold} steady</span><span class="pill p2">${counts.down} down</span></div></div>
      <div class="stat"><span class="label">Best 10 m (sec)</span><span class="bignum" style="font-size:34px">${spVals.length?Math.min(...spVals).toFixed(2):"&ndash;"}</span>${spark(spVals,true)}</div>
      <div class="stat"><span class="label">Hamstring checks</span><div class="dots">${pains.length?pains.map(s=>`<span class="dot d${s.pain||0}" title="${esc(s.date)}">${s.pain||0}</span>`).join(""):'<span class="small muted">None yet</span>'}</div><span class="small muted">Oldest to newest. 2 or 3 means sore.</span></div>
    </div></div>`;
  const flags=trends.filter(({t})=>t.status==="down"&&t.sore);
  if(flags.length) h+=`<div class="banner bad">Talk to Dad: ${flags.map(({g})=>esc(g.name)).join(", ")} ${flags.length>1?"are":"is"} going down while your legs have been sore.</div>`;
  if(!series.length){
    h+=`<div class="card"><h3>No lifts logged yet</h3><p class="muted" style="margin:0">Finish a session from the Today tab. Each lift gets its own card here with your best set, total volume, and whether you are going up, holding, or going down.</p></div>`;
    $("#app").innerHTML=h; return;
  }
  let blk="";
  for(const {g,t} of trends){
    if(g.block!==blk){ blk=g.block; h+=`<div class="label" style="padding-top:4px">${esc(blk)}</div>`; }
    const last=g.pts[g.pts.length-1]; const best=Math.max(...g.pts.map(p=>p.top));
    const unit=g.kind==="weight"?" lb":" reps";
    const notes=g.pts.filter(p=>p.note).reverse();
    h+=`<div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start"><h3 style="min-width:0;flex:1">${esc(g.name)}</h3><span class="pill ${STATUS[t.status][1]}">${STATUS[t.status][0]}</span></div>
      <p style="margin:0">${esc(chaseLine(t,g.kind))}</p>
      <div class="stats">
        <div class="stat"><span class="label">${g.kind==="weight"?"Top weight":"Most reps in a set"}</span><span class="bignum" style="font-size:30px">${last.top}<span class="small muted">${unit}</span></span>${t.status!=="new"?`<span class="small ${t.dw>=0?"good":"badt"}">${sign(t.dw)} vs before</span>`:""}${spark(g.pts.map(p=>p.top),false)}</div>
        <div class="stat"><span class="label">Total volume</span><span class="bignum" style="font-size:30px">${last.vol.toLocaleString()}<span class="small muted">${g.kind==="weight"?" lb":" reps"}</span></span>${t.status!=="new"?`<span class="small ${t.dv>=0?"good":"badt"}">${sign(t.dv)} vs before</span>`:""}${spark(g.pts.map(p=>p.vol),false)}</div>
      </div>
      <details><summary>Dad detail</summary>
        <p class="small muted">${g.pts.length} sessions. Best ever: ${best}${unit}. ${t.status!=="new"?`Last ${t.k} sessions vs the ${t.k} before: top ${sign(t.dw)}, volume ${sign(t.dv)}.`:""} Holiday and learning weeks have fewer sets, so volume dips there are expected.</p>
        <div class="tbl"><table><thead><tr><th>Date</th><th>Sets</th><th>Top</th><th>Volume</th></tr></thead><tbody>
        ${[...g.pts].reverse().map(p=>`<tr><td>${parse(p.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</td><td>${setStr(p,g.kind)}</td><td>${p.top}</td><td>${p.vol.toLocaleString()}</td></tr>`).join("")}
        </tbody></table></div>
        ${notes.length?`<div class="label">Notes</div><ul class="cues">${notes.map(p=>`<li><b>${parse(p.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}:</b> ${esc(p.note)}</li>`).join("")}</ul>`:""}
      </details>
    </div>`;
  }
  $("#app").innerHTML=h;
}

/* ---------- History + edit ---------- */
function renderLog(){
  const list=sortedSessions();
  let h="";
  if(S.stale) h+=`<div class="banner warn">Can't reach the saved log right now. What you see may be out of date.</div>`;

  const un=unsynced();
  if(un.length) h+=`<div class="card"><p style="margin:0">${un.length} session${un.length>1?"s are":" is"} saved on this phone but not online yet.</p><button class="btn" id="sync">Upload ${un.length>1?"them":"it"} now</button></div>`;
  h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2>History</h2><span class="muted small">${list.length} logged</span></div><p class="small muted" style="margin:0">Tap a session to fix a number, change the date, or delete it.</p>`;
  if(!S.loaded) h+=`<p class="muted">Loading your log.</p>`;
  else if(!list.length) h+=`<p class="muted" style="margin:0">No sessions yet. Finish your first one from the Today tab and it shows up here.</p>`;
  else{
    const pl=["None","Tight","Sore","Pain"];
    h+=`<div class="loglist">${list.map(s=>{const d=parse(s.date);
      const sq=(s.ex||[]).find(x=>/squat/i.test(x.name)&&x.kind==="weight"); const sqTop=sq&&sq.sets.length?Math.max(0,...sq.sets.map(z=>z.w||0)):0;
      return `<button class="logitem" data-id="${esc(s.id)}"><div class="date"><span class="small">${d.toLocaleDateString(undefined,{month:"short"}).toUpperCase()}</span><b>${d.getDate()}</b></div>
      <div style="min-width:0"><div style="font-weight:700">${esc(s.label||s.day)}</div><div class="small muted">${esc(s.day)} &middot; ${s.where==="home"?"Home":"Gym"} &middot; ${s.len} min${sqTop?" &middot; squat "+sqTop+" lb":""}</div>${s.note?`<div class="small" style="overflow-wrap:anywhere">${esc(s.note)}</div>`:""}</div>
      <span class="pill p${s.pain||0}">Legs: ${pl[s.pain||0]}</span></button>`}).join("")}</div>`;
  }
  h+=`</div>`;
  $("#app").innerHTML=h;
  document.querySelectorAll(".logitem").forEach(b=>b.onclick=()=>{ const s=S.sessions.find(x=>x.id===b.dataset.id); if(!s) return; S.edit={orig:s.id,doc:JSON.parse(JSON.stringify(s)),confirm:false}; render(); window.scrollTo(0,0); });
  const sy=$("#sync"); if(sy) sy.onclick=async()=>{ sy.disabled=true; sy.textContent="Adding"; const ok=await syncLocal(); if(!ok){ sy.disabled=false; sy.textContent="Try again"; } else render(); };
}
function renderEdit(){
  const E=S.edit, d=E.doc;
  let h=`<div class="row" style="justify-content:space-between"><span class="step-count">EDIT SESSION</span><button class="btn ghost small" id="ecancel">Cancel</button></div>
  <div class="card"><h2>${esc(d.label||d.day)}</h2>
    <div class="label">Date</div><input type="date" id="edate" value="${esc(d.date)}" max="${todayStr}" class="field">
    <div class="label">Where</div>${seg("ewhere",[["gym","Gym"],["home","Home"]],d.where)}
    <div class="label">Hamstring check</div>${seg("epain",[[0,"0 None"],[1,"1 Tight"],[2,"2 Sore"],[3,"3 Pain"]],d.pain||0)}
    <div class="label">Session notes</div><textarea id="enote">${esc(d.note||"")}</textarea></div>`;
  (d.ex||[]).forEach((e,ei)=>{
    if(e.kind==="check") return;
    h+=`<div class="card"><h3>${esc(e.name)}</h3><div class="sets">`;
    if(!e.sets.length) h+=`<p class="small muted" style="margin:0">Nothing logged.</p>`;
    e.sets.forEach((z,i)=>{
      if(e.kind==="weight") h+=`<div class="setrow"><span class="n">${i+1}</span><input data-e="${ei}" data-i="${i}" data-f="w" inputmode="decimal" value="${z.w??""}" placeholder="lb" aria-label="${esc(e.name)} set ${i+1} weight"><input data-e="${ei}" data-i="${i}" data-f="r" inputmode="numeric" value="${z.r??""}" placeholder="reps" aria-label="${esc(e.name)} set ${i+1} reps"><span></span></div>`;
      else if(e.kind==="sprint") h+=`<div class="setrow two"><span class="n">${i+1}</span><input data-e="${ei}" data-i="${i}" data-f="t" inputmode="decimal" value="${z.t??""}" placeholder="sec" aria-label="${esc(e.name)} rep ${i+1} time"><span></span></div>`;
      else h+=`<div class="setrow two"><span class="n">${i+1}</span><input data-e="${ei}" data-i="${i}" data-f="r" inputmode="numeric" value="${z.r??""}" placeholder="reps" aria-label="${esc(e.name)} set ${i+1} reps"><span></span></div>`;
    });
    h+=`</div><div class="label">Note</div><textarea data-note="${ei}">${esc(e.note||"")}</textarea></div>`;
  });
  h+=`<button class="btn" id="esave">Save changes</button>
  <button class="btn ghost" id="edel" style="color:var(--bad);border-color:var(--bad)">${E.confirm?"Tap again to delete for good":"Delete session"}</button><div id="emsg"></div>`;
  $("#app").innerHTML=h;
  $("#ecancel").onclick=()=>{S.edit=null;render()};
  $("#edate").onchange=e=>{if(e.target.value) d.date=e.target.value};
  bindSeg("ewhere",v=>{d.where=v;document.querySelectorAll("#ewhere button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v))});
  bindSeg("epain",v=>{d.pain=Number(v);document.querySelectorAll("#epain button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v))});
  $("#enote").oninput=e=>{d.note=e.target.value};
  document.querySelectorAll("input[data-e]").forEach(inp=>inp.oninput=()=>{const z=d.ex[inp.dataset.e].sets[inp.dataset.i]; z[inp.dataset.f]=inp.value===""?null:Number(inp.value);});
  document.querySelectorAll("textarea[data-note]").forEach(t=>t.oninput=()=>{d.ex[t.dataset.note].note=t.value});
  $("#esave").onclick=async()=>{ d.id=d.date+"_"+d.day; d.saved=d.saved||Date.now();
    try{ await saveSession(d,E.orig); S.edit=null; render(); }catch(e){ $("#emsg").innerHTML=`<div class="banner bad">Could not save the change. Check your connection and try again.</div>`; } };
  $("#edel").onclick=async()=>{ if(!E.confirm){E.confirm=true;$("#edel").textContent="Tap again to delete for good";return;}
    try{ await deleteSession(E.orig); S.edit=null; render(); }catch(e){ $("#emsg").innerHTML=`<div class="banner bad">Could not delete. Check your connection and try again.</div>`; } };
}

/* ---------- Backup ---------- */
function toCSV(){
  const q=v=>{const s=v==null?"":String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[["date","day","where","minutes","hamstring_check","exercise","set","weight_lb","reps","sprint_sec","exercise_note","session_note"]];
  for(const s of [...sortedSessions()].reverse()) for(const e of s.ex||[]){
    if(!e.sets||!e.sets.length){ if(e.kind==="check") continue; }
    (e.sets.length?e.sets:[{}]).forEach((z,i)=>rows.push([s.date,s.day,s.where,s.len,s.pain,e.name,i+1,z.w,z.r,z.t,i===0?e.note:"",""]));
  }
  for(const s of sortedSessions()) if(s.note) rows.push([s.date,s.day,s.where,s.len,s.pain,"(session note)","","","","","",s.note]);
  return rows.map(r=>r.map(q).join(",")).join("\n");
}
async function exportBackup(btn,msgEl){
  const name="chase-training-log-"+todayStr+".csv";
  const file=new File([toCSV()],name,{type:"text/csv"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Training log backup"});
      msgEl.innerHTML=`<div class="banner info small">Backup ready. Pick Save to Files or email it to Dad.</div>`; return;
    }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const url=URL.createObjectURL(file); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  msgEl.innerHTML=`<div class="banner info small">Backup downloaded. Open it in Google Sheets or Excel.</div>`;
}

/* ---------- Sign in ---------- */
function renderAuth(){
  const A=S.auth; const mode=A.step;
  const titles={signin:"Sign in",signup:"Create your account",forgot:"Reset password",newpass:"Set a new password",check:"Check your email"};
  let h=`<div class="card"><div class="label">Rugby Prep</div><h1>${titles[mode]||"Sign in"}</h1><p class="muted" style="margin:0">Your training log saves online to your account, so it never gets erased.</p></div>`;
  if(!sb){ h+=`<div class="banner bad">Could not load the sign-in service. Check your connection and reload.</div>`; $("#app").innerHTML=h; return; }
  if(mode==="check"){
    h+=`<div class="card"><p style="margin:0">${esc(A.info||"")}</p><button class="btn" id="tosignin">Back to sign in</button></div>`;
  } else if(mode==="newpass"){
    h+=`<div class="card"><div class="label">New password (8 or more characters)</div><input type="password" id="apass" class="field" autocomplete="new-password"><button class="btn" id="asetpass">Save password</button></div>`;
  } else {
    h+=`<div class="card"><div class="label">Email</div><input type="email" id="aemail" class="field" autocomplete="email" inputmode="email" value="${esc(A.email)}" placeholder="you@example.com">`;
    if(mode!=="forgot") h+=`<div class="label">Password${mode==="signup"?" (8 or more characters)":""}</div><input type="password" id="apass" class="field" autocomplete="${mode==="signup"?"new-password":"current-password"}">`;
    h+=`<button class="btn" id="ago">${mode==="signup"?"Create account":mode==="forgot"?"Email me a reset link":"Sign in"}</button>`;
    if(mode==="signin") h+=`<button class="btn ghost" id="tosignup">First time? Create your account</button><button class="btn ghost" id="toforgot">Forgot password</button>`;
    else h+=`<button class="btn ghost" id="tosignin">Back to sign in</button>`;
    h+=`</div>`;
  }
  if(A.msg) h+=`<div class="banner warn">${esc(A.msg)}</div>`;
  $("#app").innerHTML=h;
  const go=m=>()=>{A.step=m;A.msg="";renderAuth()};
  ["tosignin","tosignup","toforgot"].forEach(id=>{const b=document.getElementById(id); if(b) b.onclick=go({tosignin:"signin",tosignup:"signup",toforgot:"forgot"}[id]);});
  const btn=$("#ago");
  if(btn) btn.onclick=async()=>{
    const email=$("#aemail").value.trim().toLowerCase(); A.email=email;
    const pass=$("#apass")?$("#apass").value:"";
    if(!/^\S+@\S+\.\S+$/.test(email)){A.msg="Type a full email address.";return renderAuth();}
    if(mode!=="forgot"&&pass.length<(mode==="signup"?8:1)){A.msg=mode==="signup"?"Use at least 8 characters for your password.":"Type your password.";return renderAuth();}
    btn.disabled=true; btn.textContent="Working";
    const here=location.origin+location.pathname;
    let r;
    if(mode==="signin") r=await sb.auth.signInWithPassword({email,password:pass});
    else if(mode==="signup") r=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:here}});
    else r=await sb.auth.resetPasswordForEmail(email,{redirectTo:here});
    if(r.error){
      const m=r.error.message||"";
      A.msg=/invalid login/i.test(m)?"Email or password is wrong.":/not confirmed/i.test(m)?"Confirm your email first. Tap the link in the email we sent, then sign in here.":/already registered|already exists/i.test(m)?"That email already has an account. Sign in instead.":/rate|seconds/i.test(m)?"Wait a minute, then try again.":/password/i.test(m)?m:"Something went wrong. Check your connection and try again.";
      return renderAuth();
    }
    if(mode==="signup"&&!(r.data&&r.data.session)){ A.step="check"; A.info="We sent a confirmation email to "+email+". Tap the link in it, then come back to this app and sign in with your email and password."; return renderAuth(); }
    if(mode==="forgot"){ A.step="check"; A.info="We sent a reset link to "+email+". Open it, set a new password, then sign in here."; return renderAuth(); }
    A.msg="";
  };
  const sp=$("#asetpass");
  if(sp) sp.onclick=async()=>{ const p=$("#apass").value; if(p.length<8){A.msg="Use at least 8 characters.";return renderAuth();}
    sp.disabled=true; const {error}=await sb.auth.updateUser({password:p});
    if(error){A.msg="Could not save the password. Open the reset link again.";return renderAuth();}
    A.step="signin"; A.msg=""; S.recovery=false; if(S.user) onSignedIn(); else render(); };
}

/* ---------- Tabs ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();window.scrollTo(0,0)});

/* ---------- Data ---------- */
S.settings=Object.assign({squat:0,push:0,bench:0,press:0},ls.get("cr-settings",{}));
S.sessions=Object.entries(ls.get("cr-sessions",{})).map(([k,v])=>({...v,id:v.id||k}));
S.store="db";
render();
async function onSignedIn(){
  db=sb; S.loaded=false; render();
  await loadSessions(); await loadSettings(); await syncLocal();
  if(!S.run&&!S.edit) render();
}
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    const had=S.user&&S.user.id; S.user=session?session.user:null; S.authReady=true;
    if(ev==="PASSWORD_RECOVERY"){ S.recovery=true; S.auth.step="newpass"; render(); return; }
    if(!S.user){ db=null; S.auth={step:"signin",email:"",msg:""}; render(); return; }
    if(had!==S.user.id) setTimeout(onSignedIn,0);
  });
} else { S.authReady=true; render(); }
document.addEventListener("visibilitychange",async()=>{ if(document.visibilityState==="visible"&&db){ await loadSessions(); await syncLocal(); if(!S.run&&!S.edit) render(); } });
</script>
